name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install lupa
      - run: sh tools/gate.sh
      - name: Tag must match the TOC version
        run: |
          VER="$(sed -n 's/^## Version:[[:space:]]*//p' editions/forever/BuffRadar.toc | head -1 | tr -d '\r')"
          [ "v$VER" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != TOC version v$VER"; exit 1; }
      - run: sh tools/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{n++} n==1' editions/forever/CHANGELOG.md > dist/notes.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/BuffRadar-*-Forever.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/BuffRadar-*-Forever.zip dist/SHA256SUMS.txt \
              --title "BuffRadar ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md --verify-tag
          fi
      - name: Verify release assets landed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name'
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets | length' | grep -qx 2
