name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --only-binary=:all: lupa==2.8
      - run: sh tools/gate.sh
      - name: Tag must match the TOC version
        run: |
          VER="$(sed -n 's/^## Version:[[:space:]]*//p' editions/forever/BuffRadar.toc | head -1 | tr -d '\r')"
          [ "v$VER" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != TOC version v$VER"; exit 1; }
      - run: sh tools/package.sh
      - name: Verify packaged Forever load order and bindings
        run: python -I tools/checkpackage.py dist/BuffRadar-*-Forever.zip .
      - name: Collect release notes
        run: |
          awk '/^## /{n++} n==1' editions/forever/CHANGELOG.md > dist/notes.md
          grep -q "^## ${GITHUB_REF_NAME#v}\([[:space:]]\|$\)" dist/notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forever-release
          path: |
            dist/BuffRadar-*-Forever.zip
            dist/SHA256SUMS.txt
            dist/notes.md
          if-no-files-found: error
          compression-level: 0
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: forever-release
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GH_REPO="$GITHUB_REPOSITORY"
          (cd dist && sha256sum -c SHA256SUMS.txt)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/BuffRadar-*-Forever.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/BuffRadar-*-Forever.zip dist/SHA256SUMS.txt \
              --title "BuffRadar ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md --verify-tag
          fi
      - name: Verify published release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GH_REPO="$GITHUB_REPOSITORY"
          zip="BuffRadar-${GITHUB_REF_NAME#v}-Forever.zip"
          mkdir readback
          gh release download "$GITHUB_REF_NAME" --dir readback --pattern "$zip" --pattern SHA256SUMS.txt
          cmp dist/SHA256SUMS.txt readback/SHA256SUMS.txt
          (cd readback && sha256sum -c SHA256SUMS.txt)
          cmp "dist/$zip" "readback/$zip"
