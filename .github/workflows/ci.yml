name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - name: Gate (static checks + smoke on six fake-client setups)
        run: sh tools/gate.sh
      - name: Package (dry run)
        run: sh tools/package.sh
