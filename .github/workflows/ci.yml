name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --only-binary=:all: lupa==2.8
      - name: Gate (static checks + smoke on six fake-client setups)
        run: sh tools/gate.sh
      - name: Package (dry run)
        run: sh tools/package.sh
      - name: Verify packaged Forever load order and bindings
        run: python -I tools/checkpackage.py dist/BuffRadar-*-Forever.zip .
